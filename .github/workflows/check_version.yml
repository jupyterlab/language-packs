name: Check language packs version

on:
  pull_request:
    paths:
      - 'language-packs/**/__init__.py'

jobs:
  check_version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Check language packs version homogeneity
        run: |
          python -m pip install hatch
          python scripts/04_check_version.py
